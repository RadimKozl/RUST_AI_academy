[package]
name = "lm_linfa_market_pipeline"
version = "0.1.0"
edition = "2024"

[lib]
name = "lm_linfa_market_pipeline"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lm_linfa_market_pipeline_cli"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "parquet"] }
ndarray = "0.16.1"
linfa = "0.8.1"
linfa-trees = { version = "0.8.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0.104"


[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }