[package]
name = "lm_linfa_decision_tree"
version = "0.1.0"
edition = "2024"

[lib]
name = "lm_linfa_decision_tree"
crate-type = ["rlib"]

[[bin]]
name = "lm_linfa_decision_tree_cli"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet"] }
ndarray = { version = "0.16.1", features = ["serde"] }
ndarray-rand = "0.16.0"
linfa = "0.8.1"
linfa-nn = "0.8.1"
linfa-trees = "0.8.1"
anyhow = "1.0.103"
rand = "0.8"
plotters = "0.3.7"
image = "0.25.10"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
bincode = "2.0"
linfa-datasets = { version = "0.8.1", features = ["iris"] }

[dev-dependencies]
tempfile = "3.27.0"
