[package]
name = "lm_smartcore_logistic_regression"
version = "0.1.0"
edition = "2024"

[lib]
name = "lm_smartcore_logistic_regression"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lm_smartcore_logistic_regression_cli"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet"] }
ndarray = { version = "0.16.0", features = ["serde"] }
ndarray-rand = "0.16.0"
anyhow = "1.0"
rand = "0.10.2"
plotters = "0.3.7"
image = "0.25.10"
eframe = "0.36.1"
egui = "0.27"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
bincode = "1.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
smartcore = { version = "0.6.14", features = ["serde", "datasets"] }


[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
