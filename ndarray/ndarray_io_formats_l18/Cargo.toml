[package]
name = "ndarray_io_formats_l18"
version = "0.1.0"
edition = "2024"

[lib]
name = "ndarray_io_formats_l18"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ndarray_io_cli"
path = "src/main.rs"

[dependencies]
# Tensor basis
ndarray = { version = "0.17.2", features = ["serde"] }

# CSV podpora
csv = "1.3.1"
ndarray-csv = "0.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error Handling
thiserror = "2.0.20"

# High-Performance Parquet Engine
polars = { version = "0.55.2", features = ["parquet", "lazy"] }
polars-core = { version = "0.55.2", features = ["ndarray"] }
polars-io = { version = "0.55.2", features = ["parquet"] }

# CPython & NumPy Interop (volitelné pro C-ABI / Python rozšíření)
pyo3 = { version = "0.29.2", features = ["extension-module"], optional = true }
numpy = { version = "0.29.0", optional = true }

[features]
default = []
python-extension = ["dep:pyo3", "dep:numpy"]
