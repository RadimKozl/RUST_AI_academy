[package]
name = "gfrig_marl_swarm"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Supervisory Multi-Agent System (LangGraph to Rig & Graph-Flow port in Rust)"

[lib]
name = "gfrig_marl_swarm"
path = "src/lib.rs"

[[bin]]
name = "gfrig_marl_swarm"
path = "src/main.rs"


[dependencies]
# Serialization, JSON Schema & Error States
rig = "0.46"
graph-flow = { version = "0.8", default-features = false }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Serialization, JSON Schema & Error States
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"


# HTTP Client, XML & HTML Scraping (RAG & API Tools)
reqwest = { version = "0.13.5", features = ["json"] }
roxmltree = "0.21"
scraper = "0.29.0"
urlencoding = "2.1"

# Neuro-symbolic Mathematics, Visualization, and Coding
mathcore = "0.3.1"
plotters = "0.3"
base64 = "0.23.1"
rand = "0.10.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"