[package]
name = "model_chat_history"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Base of Chat history sample in Rust"

[lib]
name = "model_chat_history"
path = "src/lib.rs"

[[bin]]
name = "model_chat_history"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
