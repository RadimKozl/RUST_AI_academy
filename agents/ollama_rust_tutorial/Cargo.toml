[package]
name = "ollama_rust_tutorial"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Base Ollama sample in Rust"


[lib]
name = "ollama_rust_tutorial"
path = "src/lib.rs"

[[bin]]
name = "ollama_rust_tutorial"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
