[package]
name = "rig_multi_provider"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Multi-Provider AI Tutorial v Rustu (Rig Framework)"

[lib]
name = "rig_multi_provider"
path = "src/lib.rs"

[[bin]]
name = "rig_multi_provider"
path = "src/main.rs"

[dependencies]
rig = "0.45.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"

