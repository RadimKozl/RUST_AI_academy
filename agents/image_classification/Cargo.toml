[package]
name = "image_classification"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Base Ollama multimedial object classification by  VL model in Rust"

[lib]
name = "image_classification"
path = "src/lib.rs"

[[bin]]
name = "image_classification"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23.0"
image = "0.25.10"
imageproc = "0.25" 
uuid = { version = "1.0", features = ["v4"] } #UUID for generating unique names
