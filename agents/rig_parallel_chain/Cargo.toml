[package]
name = "rig_parallel_chain"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Parallel Chain (Rig Framework)"

[lib]
name = "rig_parallel_chain"
path = "src/lib.rs"

[[bin]]
name = "rig_parallel_chain"
path = "src/main.rs"

[dependencies]
rig = "0.46.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
