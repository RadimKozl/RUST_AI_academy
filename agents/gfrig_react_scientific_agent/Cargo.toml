[package]
name = "gfrig_react_scientific_agent"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "ReAct Scientific Agent (Rig & Graph-flow Framework)"

[lib]
name = "gfrig_react_scientific_agent"
path = "src/lib.rs"

[[bin]]
name = "gfrig_react_scientific_agent"
path = "src/main.rs"

[dependencies]
rig = "0.46.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
async-trait = "0.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
urlencoding = "2.1"
thiserror = "2.0"
schemars = "1.2"
rand = "0.10.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.42", features = ["bundled"] }
base64 = "0.23.1"
mathcore = "0.3.1"

[dev-dependencies]
tempfile = "3.10"