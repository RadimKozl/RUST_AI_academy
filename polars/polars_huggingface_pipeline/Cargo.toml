[package]
name = "polars_huggingface_pipeline"
version = "0.1.0"
edition = "2024"

[lib]
name = "polars_huggingface_pipeline"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "polars_huggingface_pipeline_cli"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "json", "parquet", "random"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.6", features = ["derive", "env"] }
base64 = "0.23"
sha2 = "0.11.0"
hex = "0.4"
hf-hub = "1.0.0"


[dev-dependencies]
tempfile = "3.27.0"