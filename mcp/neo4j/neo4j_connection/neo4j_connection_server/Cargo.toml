[package]
name = "neo4j_connection_server"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "MCP connection tutorial (server) implementation"

[lib]
name = "neo4j_connection_server"
path = "src/lib.rs"

[[bin]]
name = "neo4j_connection_server"
path = "src/main.rs"


[dependencies]
# Serialization, JSON Schema & Error States
neo4rs = "0.8"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
tokio-stream = "0.1"
async-trait = "0.1"
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }

# Serialization, JSON Schema & Error States
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client"] }
tempfile = "3.10"