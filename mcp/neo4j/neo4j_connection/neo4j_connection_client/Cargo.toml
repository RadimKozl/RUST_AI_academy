[package]
name = "neo4j_connection_client"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "MCP connection tutorial (client) implementation"

[lib]
name = "neo4j_connection_client"
path = "src/lib.rs"

[[bin]]
name = "neo4j_connection_client"
path = "src/main.rs"


[dependencies]
# Serialization, JSON Schema & Error States
rmcp = { version = "3.10.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"]}
anyhow = "1.0"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }