[package]
name = "create_paginated_tool_client"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "MCP paginated tool tutorial (client) implementation"

[lib]
name = "create_paginated_tool_client"
path = "src/lib.rs"

[[bin]]
name = "create_paginated_tool_client"
path = "src/main.rs"


[dependencies]
# Serialization, JSON Schema & Error States
rmcp = { version = "3.10.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"]}
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"