[package]
name = "create_resource_server"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "MCP resource tutorial (server) implementation"

[lib]
name = "create_resource_server"
path = "src/lib.rs"

[[bin]]
name = "create_resource_server"
path = "src/main.rs"


[dependencies]
# Serialization, JSON Schema & Error States
neo4rs = "0.8"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
async-trait = "0.1"

# Serialization, JSON Schema & Error States
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client"] }
tempfile = "3.10"