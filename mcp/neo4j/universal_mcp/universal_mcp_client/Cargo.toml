[package]
name = "universal_mcp_client"
version = "0.1.0"
edition = "2024"
authors = ["Radim Közl"]
description = "Universal MCP tutorial (client) implementation"

[lib]
name = "universal_mcp_client"
path = "src/lib.rs"

[[bin]]
name = "universal_mcp_client"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
bytes = "1.12"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "3.10.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-stream = "0.1"